<!doctype html><html lang="fr"><meta charset="utf-8"><title>RFT Backup</title><link rel="stylesheet" href="style.css"><body><div class="app"><aside><div class="brand">🛡️ RFT Backup</div><button data-page="dashboard" class="active">Tableau de bord</button><button data-page="configurations">Configurations</button><button data-page="explorer">Explorer</button><button data-page="activity">Activité</button><button data-page="settings">Paramètres</button></aside><main id="app"></main></div><script type="module">
const $=s=>document.querySelector(s);let state={configurations:[],activity:[],versions:[]},page='dashboard',editing=null;
async function api(path,options={}){const r=await fetch('/api'+path,{headers:{'content-type':'application/json'},...options});const j=await r.json();if(!r.ok||j.error)throw new Error(j.error||'Erreur API');return j}
const fmtBytes=n=>n?Intl.NumberFormat('fr',{style:'unit',unit:'byte',unitDisplay:'narrow'}).format(n):'0 o';const fmtDate=d=>d?new Date(d).toLocaleString('fr-FR'):'Jamais';
async function refresh(){state=await api('/state');render()}
function nav(){document.querySelectorAll('aside button').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
function render(){nav(); if(page==='dashboard')dashboard(); if(page==='configurations')configs(); if(page==='activity')activity(); if(page==='explorer')explorer(); if(page==='settings')$('#app').innerHTML='<h1>Paramètres</h1><p class="panel">Le stockage sécurisé des secrets SFTP sera traité dans une PR dédiée. Cette API ne renvoie jamais les mots de passe.</p>'}
async function dashboard(){const d=await api('/dashboard');$('#app').innerHTML=`<p class="eyebrow">État global</p><h1>${d.health==='healthy'?'Vos données sont protégées':'RFT Backup a besoin de votre attention'}</h1><section class="hero"><div><h2>${d.health}</h2><p>Dernier résultat réel du moteur de sauvegarde.</p></div><button class="primary" id="backupNow">Sauvegarder maintenant</button></section><section class="cards"><div class="card"><span>Dernière sauvegarde</span><strong>${fmtDate(d.lastBackup?.end)}</strong></div><div class="card"><span>Prochaine sauvegarde</span><strong>${fmtDate(d.nextBackup)}</strong></div><div class="card"><span>Données protégées</span><strong>${fmtBytes(d.protectedDataBytes)}</strong></div><div class="card"><span>SFTP</span><strong>${d.sftpStatus}</strong></div></section><section class="panel"><h2>Configurations actives</h2>${state.configurations.map(c=>`<p>${c.enabled?'✅':'⏸️'} ${c.name}</p>`).join('')||'<p>Aucune configuration.</p>'}</section>`;$('#backupNow').onclick=()=>runBackup(state.configurations.find(c=>c.enabled)?.id)}
function configs(){const c=editing?state.configurations.find(x=>x.id===editing):null;$('#app').innerHTML=`<h1>Configurations</h1><section class="split"><div class="panel"><button class="primary" id="newCfg">Créer</button>${state.configurations.map(x=>`<article class="row"><b>${x.name}</b><small>${x.folders.length} dossier(s) · keep_last ${x.retention.count}</small><div><button data-edit="${x.id}">Modifier</button><button data-run="${x.id}">Lancer</button><button data-toggle="${x.id}">${x.enabled?'Désactiver':'Activer'}</button><button data-del="${x.id}">Supprimer</button></div></article>`).join('')||'<p>Aucune configuration.</p>'}</div><form class="panel" id="form"><h2>${c?'Modifier':'Nouvelle configuration'}</h2><h3>Informations générales</h3><label>Nom<input name="name" value="${c?.name??''}" required></label><label><input type="checkbox" name="enabled" ${c?.enabled!==false?'checked':''}> Active</label><h3>Dossiers à sauvegarder</h3><label>Un dossier par ligne<textarea name="folders">${c?.folders.map(f=>f.path).join('\n')??''}</textarea></label><h3>Serveur SFTP</h3><label>Hôte<input name="host" value="${c?.destination.host??''}"></label><label>Port<input name="port" type="number" value="${c?.destination.port??22}"></label><label>Nom d’utilisateur<input name="username" value="${c?.destination.username??''}"></label><label>Mot de passe<input name="password" type="password" placeholder="${c?'Conservé si vide':''}"></label><label>Chemin distant<input name="remotePath" value="${c?.destination.remotePath??''}"></label><label>Délai d’expiration (ms)<input name="timeoutMs" type="number" value="${c?.destination.timeoutMs??15000}"></label><h3>Politique de rétention</h3><label>keep_last<input name="keep" type="number" min="1" value="${c?.retention.count??3}"></label><h3>Résumé</h3><p>Les dossiers sélectionnés seront empaquetés en .rftpkg puis envoyés via le transport configuré.</p><div class="actions"><button class="primary">Enregistrer</button><button type="button" id="test">Tester la connexion</button></div><p id="msg"></p></form></section>`; bindConfig(c)}
function formConfig(c){const f=$('#form');return {id:c?.id,name:f.name.value,enabled:f.enabled.checked,folders:f.folders.value.split('\n').map(x=>({path:x.trim(),included:true})).filter(x=>x.path),destination:{type:'sftp',host:f.host.value,port:f.port.value,username:f.username.value,password:f.password.value,remotePath:f.remotePath.value,timeoutMs:f.timeoutMs.value},retention:{type:'keep_last',count:f.keep.value}}}
function bindConfig(c){$('#newCfg').onclick=()=>{editing=null;configs()};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=b.dataset.edit;configs()});document.querySelectorAll('[data-run]').forEach(b=>b.onclick=()=>runBackup(b.dataset.run));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{await api('/configurations/'+b.dataset.del,{method:'DELETE'});await refresh()});document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{const x=state.configurations.find(c=>c.id===b.dataset.toggle);await api('/configurations/'+x.id,{method:'PUT',body:JSON.stringify({...x,enabled:!x.enabled})});await refresh()});$('#form').onsubmit=async e=>{e.preventDefault();await api(c?'/configurations/'+c.id:'/configurations',{method:c?'PUT':'POST',body:JSON.stringify(formConfig(c))});editing=null;await refresh()};$('#test').onclick=async()=>{try{await api('/test-connection',{method:'POST',body:JSON.stringify(formConfig(c))});$('#msg').textContent='Connexion réussie.'}catch(e){$('#msg').textContent='Erreur: '+e.message}}}
async function runBackup(id){if(!id)return alert('Aucune configuration active.');const m=$('#app');m.insertAdjacentHTML('afterbegin','<p class="toast">Sauvegarde en cours…</p>');try{await api('/configurations/'+id+'/backup',{method:'POST'});await refresh();page='activity';render()}catch(e){alert(e.message);await refresh()}}
function activity(){ $('#app').innerHTML=`<h1>Activité</h1><section class="panel timeline">${state.activity.map(a=>`<article><b>${a.configurationName??a.configurationId}</b><span>${fmtDate(a.end??a.start)} · ${a.durationMs??0} ms · ${a.result}</span><p>${a.explanation}</p><details><summary>Détails techniques</summary><pre>${(a.technicalDetails??[]).join('\n')}</pre></details></article>`).join('')||'<p>Aucune activité.</p>'}</section>`}
function explorer(){ $('#app').innerHTML=`<h1>Explorer</h1><section class="panel">${state.versions.map(v=>`<article class="row"><b>${v.configurationName??v.configurationId}</b><small>${fmtDate(v.createdAt)} · ${v.fileCount} fichier(s) · ${fmtBytes(v.totalBytes)} · ${v.remotePath}</small></article>`).join('')||'<p>Aucune version sauvegardée.</p>'}</section>`}
document.querySelectorAll('aside button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});refresh();
</script></body></html>
